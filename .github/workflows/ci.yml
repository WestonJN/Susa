name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: https://staging.invalid
      - name: Check SEO output exists
        run: |
          for f in dist/index.html dist/get-quote/index.html dist/sitemap.xml dist/robots.txt dist/404.html dist/og-image.png; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          grep -q '<link rel="canonical"' dist/index.html
          grep -q 'application/ld+json' dist/index.html
