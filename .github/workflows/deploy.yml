name: Deploy to GitHub Pages

# Works with no domain and no settings: the site is published at
#   https://<owner>.github.io/<repo>/
# Optional repository Variables (Settings > Secrets and variables > Actions > Variables):
#   CUSTOM_DOMAIN, SITE_NAME, WHATSAPP_NUMBER, PHONE, CONTACT_EMAIL, API_BASE_URL, VAT_REGISTERED, GSC_VERIFICATION

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Work out the site address
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_SITE_BASE: ${{ vars.SITE_BASE }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            url="https://$CUSTOM_DOMAIN"; base="/"
          elif [ -n "$VAR_SITE_URL" ]; then
            url="$VAR_SITE_URL"; base="${VAR_SITE_BASE:-/}"
          elif [ "$repo_lc" = "$owner.github.io" ]; then
            url="https://$owner.github.io"; base="/"
          else
            url="https://$owner.github.io"; base="/$REPO/"
          fi
          echo "Publishing at: $url$base"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_BASE: ${{ env.SITE_BASE }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          VITE_SITE_NAME: ${{ vars.SITE_NAME || 'Susa' }}
          VITE_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          VITE_PHONE: ${{ vars.PHONE }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_VAT_REGISTERED: ${{ vars.VAT_REGISTERED || 'false' }}
          VITE_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
